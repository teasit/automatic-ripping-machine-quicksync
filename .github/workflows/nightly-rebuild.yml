name: Nightly rebuild on base image update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the base image is unchanged"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - presets/**
      - scripts/**
      - .github/workflows/nightly-rebuild.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BASE_IMAGE: docker.io/automaticrippingmachine/automatic-ripping-machine:latest
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.compare.outputs.rebuild }}
      base_digest: ${{ steps.compare.outputs.base_digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Compute image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Compare base image digest with the one recorded in our image
        id: compare
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          base_digest=$(skopeo inspect --format '{{.Digest}}' "docker://${BASE_IMAGE}")
          echo "Current base digest: $base_digest"
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"

          # Missing image (first run) yields an empty value and triggers a build.
          our_base=$(skopeo inspect --format '{{ index .Labels "org.opencontainers.image.base.digest" }}' \
            "docker://${IMAGE}:latest" 2>/dev/null || true)
          echo "Recorded base digest: ${our_base:-<none>}"

          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.force }}" == "true" || "$base_digest" != "$our_base" ]]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      # The release upgrade makes the build large; reclaim runner disk space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.check.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ needs.check.outputs.base_digest }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
